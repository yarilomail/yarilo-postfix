image:
  postfix:
    repository: ghcr.io/yarilomail/yarilo-postfix
    tag: latest
    pullPolicy: Always

mail:
  domain: d00001.test
  hostname: relay.d00001.test
  mynetworks: "127.0.0.0/8 10.0.0.0/8 10.1.0.0/16"

yarilo:
  saslLoginAddr: "yarilo-sasl-login.yarilo-sb.svc.cluster.local:12345"
  lmtpHost: "yarilo-lmtp-login.yarilo-sb.svc.cluster.local"
  lmtpPort: "24"

mysql:
  secretName: yarilo-mysql
  host: "mysql.db.svc.cluster.local"

tls:
  secretName: yarilo-tls
  ## relay-mx and relay-fwd: the public name, renewed by cert-manager (DNS-01).
  certificate:
    enabled: true
    issuerRef:
      name: letsencrypt-prod
      kind: ClusterIssuer
    dnsNames:
      - mail-sb.seconddns.com

dkim:
  selector: defaultmail

rspamd:
  rejectScore: 15
  addHeaderScore: 6

resources:
  rspamd:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# dkim-milter signs, installed beside this release in yarilo-relay.
opendkim:
  enabled: false

dkimMilter:
  addr: "dkim-milter:8891"

mx:
  enabled: true
  rblRestrictions: ""
  # Both listeners, because the smoketest reads both ways a fronted address can
  # arrive; 25 stays the plain MX.
  clientAddress:
    xclientPort: 10024
    proxyPort: 10025
    # Only the smoketest Job dials them; relay-mx logs show no other client.
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: yarilo-sb
        podSelector:
          matchLabels:
            job-name: smoketest
  service:
    type: ClusterIP
    port: 25

mta:
  enabled: true
  ## Sender check before the signer; the milter runs in this namespace.
  mailfromMilter:
    addr: "mailfrom-milter:10031"
  ## relay-mta: yarilo's Submission dials it by its service name and verifies
  ## it against the internal CA; an Issuer on a copy of that CA lives here.
  tls:
    secretName: relay-mta-tls
    certificate:
      enabled: true
      issuerRef:
        name: yarilo-internal-ca
        kind: Issuer
      dnsNames:
        - relay-mta.yarilo-relay.svc.cluster.local
        - relay-mta.yarilo-relay.svc
        - relay-mta.yarilo-relay
    ## On a hand-made copy of yarilo-sb's CA: README, "relay-mta's certificate from an internal CA".
    issuer:
      enabled: true
      caSecretName: yarilo-internal-ca
  service:
    type: ClusterIP
    port: 587

fwd:
  enabled: true
  lmtpAddr: "yarilo-lmtp-login.yarilo-sb.svc.cluster.local:24"
  saslUser: "sieve_relay"
  saslSecretName: "fwd-sasl-secret"
  ## yarilo's Sieve sender dials relay-fwd:587 by its service name and
  ## verifies it against the internal CA, as Submission does relay-mta.
  tls:
    secretName: relay-fwd-tls
    certificate:
      enabled: true
      issuerRef:
        name: yarilo-internal-ca
        kind: Issuer
      dnsNames:
        - relay-fwd.yarilo-relay.svc.cluster.local
        - relay-fwd.yarilo-relay.svc
        - relay-fwd.yarilo-relay
  service:
    type: ClusterIP
    port: 25

## Mail for other domains leaves through relay-fwd-out, signed
## d=fwd.d00001.test by dkim-milter-fwd and SRS-rewritten to that domain.
fwdOut:
  enabled: true
  saslUser: "fwd_out"
  saslSecretName: "fwd-out-sasl-secret"
  dkimMilter:
    addr: "dkim-milter-fwd:8891"
  tls:
    secretName: relay-fwd-out-tls
    certificate:
      enabled: true
      issuerRef:
        name: yarilo-internal-ca
        kind: Issuer
      dnsNames:
        - relay-fwd-out.yarilo-relay.svc.cluster.local
        - relay-fwd-out.yarilo-relay.svc
        - relay-fwd-out.yarilo-relay
  rateLimit:
    messagesPerMinute: 30

postsrsd:
  enabled: true
  # dkim-milter-fwd's signDomain (values-sandbox-fwd.yaml in dkim-milter).
  domain: fwd.d00001.test
  secretName: postsrsd-secret
  debug: true
  service:
    type: ClusterIP

# yarilo's backend pods dial relay-mta:587 (Submission, JMAP) and
# relay-fwd:587 (Sieve); the relay logs show no other client.
networkPolicy:
  enabled: true
  submissionFrom: &yarilo-backend
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: yarilo-sb
      podSelector:
        matchLabels:
          app.kubernetes.io/instance: yarilo
          app.kubernetes.io/component: backend
  forwardFrom: *yarilo-backend

image:
  postfix:
    repository: ghcr.io/yarilomail/yarilo-postfix
    tag: latest
    pullPolicy: Always

mail:
  domain: d00001.test
  hostname: relay.d00001.test
  mynetworks: "127.0.0.0/8 10.0.0.0/8 10.1.0.0/16"

yarilo:
  saslLoginAddr: "yarilo-sasl-login.yarilo-sb.svc.cluster.local:12345"
  lmtpHost: "yarilo-lmtp-login.yarilo-sb.svc.cluster.local"
  lmtpPort: "24"

mysql:
  secretName: yarilo-mysql
  host: "mysql.db.svc.cluster.local"

tls:
  secretName: yarilo-tls
  ## Issued by the stand's internal CA, the one yarilo verifies the relay with
  ## (submission_relay_ssl_ca); one certificate for the three relays that mount it.
  certificate:
    enabled: true
    issuerRef:
      name: yarilo-internal-ca
      kind: ClusterIssuer
    dnsNames:
      - relay-mta.yarilo-relay.svc.cluster.local
      - relay-mta.yarilo-relay.svc
      - relay-mta.yarilo-relay
      - relay-mta
      - relay-mx.yarilo-relay.svc.cluster.local
      - relay-mx.yarilo-relay.svc
      - relay-mx.yarilo-relay
      - relay-mx
      - relay-fwd.yarilo-relay.svc.cluster.local
      - relay-fwd.yarilo-relay.svc
      - relay-fwd.yarilo-relay
      - relay-fwd

dkim:
  selector: defaultmail

rspamd:
  rejectScore: 15
  addHeaderScore: 6

resources:
  rspamd:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

opendkim:
  enabled: true

mx:
  enabled: true
  rblRestrictions: ""
  # Both listeners, because the smoketest reads both ways a fronted address can
  # arrive; 25 stays the plain MX.
  clientAddress:
    xclientPort: 10024
    proxyPort: 10025
  service:
    type: ClusterIP
    port: 25

mta:
  enabled: true
  service:
    type: ClusterIP
    port: 587

fwd:
  enabled: true
  lmtpAddr: "yarilo-lmtp-login.yarilo-sb.svc.cluster.local:24"
  saslUser: "sieve_relay"
  saslSecretName: "fwd-sasl-secret"
  service:
    type: ClusterIP
    port: 25

postsrsd:
  enabled: true
  domain: mail-sb.seconddns.com
  secretName: postsrsd-secret
  debug: true
  service:
    type: ClusterIP

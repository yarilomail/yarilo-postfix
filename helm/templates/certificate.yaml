{{- with .Values.tls.certificate }}
{{- if .enabled }}
{{- if not $.Values.tls.secretName }}
{{- fail "tls.certificate.enabled needs tls.secretName: the Certificate writes that Secret" }}
{{- end }}
{{- if not .issuerRef.name }}
{{- fail "tls.certificate.enabled needs tls.certificate.issuerRef.name" }}
{{- end }}
{{- if not .dnsNames }}
{{- fail "tls.certificate.enabled needs tls.certificate.dnsNames" }}
{{- end }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.tls.secretName }}
  labels:
    app: relay-tls
spec:
  secretName: {{ $.Values.tls.secretName }}
  duration: {{ .duration }}
  renewBefore: {{ .renewBefore }}
  issuerRef:
    name: {{ .issuerRef.name }}
    kind: {{ .issuerRef.kind }}
    group: cert-manager.io
  dnsNames:
    {{- toYaml .dnsNames | nindent 4 }}
{{- end }}
{{- end }}

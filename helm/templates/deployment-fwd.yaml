{{- if .Values.fwd.enabled }}
{{- if not (.Values.fwd.tls.secretName | default .Values.tls.secretName) }}
{{- fail "fwd.enabled needs fwd.tls.secretName or tls.secretName: 587 with STARTTLS is relay-fwd's only listener" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-fwd
  namespace: {{ .Release.Namespace }}
  labels:
    app: relay-fwd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay-fwd
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: relay-fwd
    spec:
      containers:
        - name: postfix
          image: "{{ .Values.image.postfix.repository }}:{{ .Values.image.postfix.tag }}"
          imagePullPolicy: {{ .Values.image.postfix.pullPolicy }}
          ports:
            - containerPort: 587
              name: submission
          env:
            - name: RELAY_TYPE
              value: fwd
            - name: MAIL_DOMAIN
              value: {{ .Values.mail.domain | quote }}
            - name: MAIL_HOSTNAME
              value: {{ .Values.mail.hostname | quote }}
            - name: MAIL_MYNETWORKS
              value: {{ .Values.mail.mynetworks | quote }}
            - name: MAIL_DOMAINS
              value: {{ include "yarilo-postfix.mailDomains" . | quote }}
            - name: RSPAMD_ADDR
              value: "relay-rspamd:11332"
            {{- if .Values.fwdOut.enabled }}
            - name: FWD_OUT_ADDR
              value: "relay-fwd-out.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.fwdOut.service.port }}"
            - name: FWD_OUT_SASL_USER
              value: {{ .Values.fwdOut.saslUser | quote }}
            - name: FWD_OUT_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fwdOut.saslSecretName }}
                  key: password
            {{- else }}
            {{- with include "yarilo-postfix.fwdDkimSigner" . }}
            - name: DKIM_MILTER_ADDR
              value: {{ . | quote }}
            {{- end }}
            - name: POSTSRSD_HOST
              value: "relay-postsrsd"
            {{- end }}
            {{- if .Values.fwd.lmtpAddr }}
            - name: LMTP_ADDR
              value: {{ .Values.fwd.lmtpAddr | quote }}
            {{- end }}
            {{- if .Values.fwd.saslUser }}
            - name: SASL_USER
              value: {{ .Values.fwd.saslUser | quote }}
            {{- end }}
            {{- if .Values.fwd.saslSecretName }}
            - name: SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fwd.saslSecretName }}
                  key: password
            {{- end }}
            {{- include "yarilo-postfix.mysqlEnv" .Values | nindent 12 }}
          volumeMounts:
            {{- include "yarilo-postfix.tlsMount" (.Values.fwd.tls.secretName | default .Values.tls.secretName) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources.postfix | nindent 12 }}
      volumes:
        {{- include "yarilo-postfix.tlsVolume" (.Values.fwd.tls.secretName | default .Values.tls.secretName) | nindent 8 }}
{{- end }}
